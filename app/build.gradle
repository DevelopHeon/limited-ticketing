apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':shared')
    implementation project(':member')
    implementation project(':sale')
    implementation project(':inventory')
    implementation project(':purchase')
    implementation project(':payment')

    implementation rootProject.libraries.bootDataJpa
    implementation rootProject.libraries.bootSecurity
    implementation rootProject.libraries.bootValidation
    implementation rootProject.libraries.bootWeb
    implementation rootProject.libraries.flywayCore
    implementation rootProject.libraries.modulithCore
    runtimeOnly rootProject.libraries.flywayPostgresql
    runtimeOnly rootProject.libraries.postgresql

    testImplementation rootProject.libraries.bootTest
    testImplementation rootProject.libraries.modulithDocs
    testImplementation rootProject.libraries.modulithTest
    testImplementation rootProject.libraries.testcontainersJunit
    testImplementation rootProject.libraries.testcontainersPostgresql
    testRuntimeOnly rootProject.libraries.junitPlatform
}
