server:
  port: ${PORT:8081}
spring:
  application:
    name: limited-ticketing
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/limited_ticketing}
    username: ${DB_USERNAME:limited_ticketing}
    password: ${DB_PASSWORD:limited_ticketing}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

limited-ticketing:
  kafka:
    reservation-topic: limited-ticketing.purchasewaiting.reservation.v1
    dead-letter-topic: limited-ticketing.purchasewaiting.reservation.v1-dlt
    group-id: purchasewaiting-reservation-v1
    replication-factor: 3
    min-in-sync-replicas: 2
    publisher-fixed-delay: 100
    publisher-initial-delay: 1000
  queue:
    admission:
      max-outstanding: ${QUEUE_MAX_OUTSTANDING:10000}
    worker:
      global-concurrent-processing: ${QUEUE_GLOBAL_CONCURRENT_PROCESSING:10}
      max-concurrent-processing: ${QUEUE_MAX_CONCURRENT_PROCESSING:10}
      claim-batch-size: ${QUEUE_CLAIM_BATCH_SIZE:10}
      fixed-delay: ${QUEUE_WORKER_FIXED_DELAY:100}
      initial-delay: ${QUEUE_WORKER_INITIAL_DELAY:1000}
      recovery-fixed-delay: ${QUEUE_RECOVERY_FIXED_DELAY:5000}
      recovery-initial-delay: ${QUEUE_RECOVERY_INITIAL_DELAY:5000}
      recovery-batch-size: ${QUEUE_RECOVERY_BATCH_SIZE:1000}
      processing-timeout-seconds: ${QUEUE_PROCESSING_TIMEOUT_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
