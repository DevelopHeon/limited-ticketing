plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    versions = [
            springBoot    : '3.5.16',
            springModulith: '1.4.12'
    ]

    libraries = [
            jpaApi            : 'jakarta.persistence:jakarta.persistence-api',
            springDataJpa     : 'org.springframework.data:spring-data-jpa',
            springDataRedis   : 'org.springframework.data:spring-data-redis',
            bootDataJpa       : 'org.springframework.boot:spring-boot-starter-data-jpa',
            bootDataRedis     : 'org.springframework.boot:spring-boot-starter-data-redis',
            bootSecurity      : 'org.springframework.boot:spring-boot-starter-security',
            bootValidation    : 'org.springframework.boot:spring-boot-starter-validation',
            bootWeb           : 'org.springframework.boot:spring-boot-starter-web',
            flywayCore        : 'org.flywaydb:flyway-core',
            flywayPostgresql  : 'org.flywaydb:flyway-database-postgresql',
            modulithCore      : 'org.springframework.modulith:spring-modulith-starter-core',
            modulithDocs      : 'org.springframework.modulith:spring-modulith-docs',
            postgresql        : 'org.postgresql:postgresql',
            bootTest          : 'org.springframework.boot:spring-boot-starter-test',
            modulithTest      : 'org.springframework.modulith:spring-modulith-starter-test',
            testcontainersJunit: 'org.testcontainers:junit-jupiter',
            testcontainersPostgresql: 'org.testcontainers:postgresql',
            junitPlatform     : 'org.junit.platform:junit-platform-launcher'
    ]
}

allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'checkstyle'

    checkstyle {
        toolVersion = '10.21.4'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.versions.springBoot}"
            mavenBom "org.springframework.modulith:spring-modulith-bom:${rootProject.versions.springModulith}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
