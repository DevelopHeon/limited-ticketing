services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-limited_ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-limited_ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limited_ticketing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    environment:
      APP_METRICS_TARGET: ${APP_METRICS_TARGET:-host.docker.internal:8081}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'sed "s/APP_METRICS_TARGET/$${APP_METRICS_TARGET}/g" /etc/prometheus/template.yml > /tmp/prometheus.yml; exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/template.yml:ro
      - prometheus-data:/prometheus
    cpus: 0.5
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [observability]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    cpus: 0.5
    mem_limit: 512m

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
